[workspace]
resolver = "2"
members = [
    "crates/mnemo-core",
    "crates/mnemo-storage",
    "crates/mnemo-ingest",
    "crates/mnemo-embeddings",
    "crates/mnemo-search",
    "crates/mnemo-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Mnemo Contributors"]
license = "MIT"
repository = "https://github.com/meephubub/Mnemo"

[workspace.dependencies]
mnemo-core = { path = "crates/mnemo-core" }
mnemo-storage = { path = "crates/mnemo-storage" }
mnemo-ingest = { path = "crates/mnemo-ingest" }
mnemo-embeddings = { path = "crates/mnemo-embeddings" }
mnemo-search = { path = "crates/mnemo-search" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono", "uuid"] }
sha2 = "0.10"
pdf-extract = "0.12"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# Real local embedding model backend (Phase 4 follow-up, mnemo-embeddings::bert).
# Pinned together at 0.10.2: candle-transformers 0.10.2 requires
# candle-core/candle-nn ^0.10.2 exactly (a newer 0.11.x candle-core/nn
# exists upstream, but candle-transformers has not been re-published
# against it yet), so all three are pinned to the same released,
# mutually-compatible version rather than picking the newest available
# per-crate.
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
# `ureq` (not `tokio`/`native-tls`) keeps this on a synchronous,
# pure-Rust-TLS (rustls, ureq's default backend) HTTP client — no
# system OpenSSL dependency and no tokio runtime needed just to
# download model weights once and cache them under
# `~/.cache/huggingface/hub` (or `$HF_HOME`), matching how
# `hf_hub::api::sync::Api` is used in `mnemo-embeddings::bert`.
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
tokenizers = "0.23"

# package that lives at the workspace root and provides the public
# `mnemo` facade crate described in plan.md section 62 (Core API / Crate Structure).
[package]
name = "mnemo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Local-first, high-performance personal memory and knowledge engine for AI agents."

[lib]
name = "mnemo"
path = "src/lib.rs"

[dependencies]
mnemo-core = { workspace = true }
mnemo-storage = { workspace = true }
mnemo-ingest = { workspace = true }
mnemo-embeddings = { workspace = true }
mnemo-search = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
