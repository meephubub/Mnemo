[package]
name = "mnemo-embeddings"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedding abstraction for Mnemo (Phase 4). Trait + default hashing embedder, plus a real local Candle/BERT sentence-embedding model (Phase 4 follow-up)."

[dependencies]
mnemo-core = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Real local embedding model (plan.md section 47 "Local Embedding
# Models" / ROADMAP.md Phase 4 follow-up): `bert.rs`'s `BertEmbedder`
# runs a sentence-transformers-style BERT model fully locally via
# Candle (pure-Rust tensor/NN framework — no Python, no ONNX Runtime,
# no system ML library). Model weights/config/tokenizer are fetched
# and cached by `hf-hub` the first time a `BertEmbedder` is
# constructed (not at `cargo build` time) and reused from
# `~/.cache/huggingface/hub` on every subsequent run, the same way
# Python's `huggingface_hub`/`sentence-transformers` do.
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
hf-hub = { workspace = true }
tokenizers = { workspace = true }
