[package]
name = "mnemo-search"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Retrieval engine for Mnemo. Lexical/FTS5 (Phase 3), brute-force vector search and score-fusion hybrid retrieval (Phase 4/5), token-budgeted context packing (Phase 7); reranking (Phase 6) lands in a later pass."

[dependencies]
mnemo-core = { workspace = true }
mnemo-storage = { workspace = true }
mnemo-embeddings = { workspace = true }
thiserror = { workspace = true }
# Needed directly (not just transitively via mnemo-storage) so
# `context.rs`'s neighbor-chunk expansion can name `rusqlite::Connection`
# in its own function signatures, matching the `&Connection` type
# `Db::conn()` derefs to.
rusqlite = { workspace = true }
